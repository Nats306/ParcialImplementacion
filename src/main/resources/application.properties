spring.application.name=ParcialEnanosvsCamellos

spring.config.import=optional:file:./.env[.properties]

# ===============================
# DATABASE
# ===============================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false


# ===============================
# SECURITY / KEYCLOAK
# ===============================
# keycloak.public-url  -> la URL de Keycloak tal como la ve el navegador/Swagger (fuera de Docker).
# keycloak.internal-url -> la URL de Keycloak dentro de la red de Docker (nombre del servicio en compose.yml).
# Se separan a propósito: el backend valida el token contra el emisor PUBLICO
# (lo que Keycloak realmente escribe en el JWT) pero baja las llaves públicas
# por la URL INTERNA (la única que puede resolver desde dentro del contenedor).
# Ver SecurityConfig.jwtDecoder().
keycloak.realm=${KEYCLOAK_REALM:camel-racing}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:camel-racing-app}
keycloak.public-url=${KEYCLOAK_PUBLIC_URL:http://localhost:8081}
keycloak.internal-url=${KEYCLOAK_INTERNAL_URL:http://keycloak:8080}
keycloak.issuer-uri=${keycloak.public-url}/realms/${keycloak.realm}
keycloak.jwk-set-uri=${keycloak.internal-url}/realms/${keycloak.realm}/protocol/openid-connect/certs

# Orígenes permitidos para que el frontend (que corre en otro puerto) pueda
# llamar la API. Lista separada por comas.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200,http://localhost:3000}

# Precarga el client_id en el botón "Authorize" de Swagger (si no, hay que
# escribirlo a mano cada vez, y si se escribe mal o se deja vacío Keycloak
# responde "Client not found"). El client es público (sin secreto) y usa PKCE.
springdoc.swagger-ui.oauth.client-id=${keycloak.client-id}
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true