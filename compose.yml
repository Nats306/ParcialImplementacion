services:

  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - backend-network


  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7

    command: start-dev --import-realm

    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"

    ports:
      - "${KEYCLOAK_PORT}:8080"

    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

    networks:
      - backend-network


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}

      KEYCLOAK_PUBLIC_URL: http://localhost:${KEYCLOAK_PORT}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080

      CORS_ALLOWED_ORIGINS: http://localhost:4200

    ports:
      - "8080:8080"

    depends_on:
      db:
        condition: service_healthy

      keycloak:
        condition: service_healthy



    networks:
      - backend-network


  frontend:
    build:
      context: ./camel-racing-frontend
      dockerfile: Dockerfile

    ports:
      - "4200:80"

    depends_on:
      - backend

    networks:
      - backend-network


volumes:
  postgres_data:


networks:
  backend-network:
    driver: bridge