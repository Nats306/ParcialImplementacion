services:

  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - backend-network


  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7

    # start-dev: modo de desarrollo (HTTP sin certificados, admin console
    # habilitada). --import-realm: siembra el realm/roles/usuarios de
    # keycloak/realm-export.json en cada arranque, así el proyecto queda
    # reproducible con un solo "docker compose up -d" sin pasos manuales.
    command: start-dev --import-realm

    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Fuerza a Keycloak a escribir SIEMPRE esta URL como emisor (iss) en
      # los tokens, sin importar si la petición de login llegó por la red
      # interna de Docker o desde el navegador. El backend valida el token
      # contra esta misma URL (ver keycloak.issuer-uri en application.properties).
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"

    ports:
      - "${KEYCLOAK_PORT}:8080"

    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

    healthcheck:
      # El endpoint de salud vive en la interfaz de management (puerto 9000
      # interno), no en el puerto 8080 de la app — así viene desde Keycloak
      # 24+. Si se apunta al 8080 el healthcheck nunca da "UP" aunque
      # Keycloak esté funcionando perfectamente.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

    networks:
      - backend-network


# El backend (Spring Boot) y el frontend todavía se corren fuera de Docker
# (ver README). Cuando se dockericen, sus servicios se agregan acá, en la
# misma red "backend-network", para que el backend pueda resolver
# "http://keycloak:8080" y "http://db:5432" por nombre de servicio.


volumes:
  postgres_data:


networks:
  backend-network:
    driver: bridge