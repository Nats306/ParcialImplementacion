<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">🐫🆚⛏️</span>
      <span class="brand-text">Camel vs. Dwarf<br />Racing</span>
    </div>

    <nav class="nav">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">{{ item.icon }}</span>
          {{ item.label }}
        </a>
      }
      <a routerLink="/audit" routerLinkActive="active" class="nav-item" *appHasRole="['ADMINISTRATOR']">
        <span class="nav-icon">📜</span>
        Audit log
      </a>
    </nav>

    <div class="user-card">
      <a routerLink="/profile" class="user-name" routerLinkActive="active">{{ profile()?.fullName || profile()?.username }}</a>
      <span class="badge role-badge">{{ roleLabel() }}</span>
      <button class="btn btn-ghost btn-sm logout-btn" (click)="logout()">Cerrar sesión</button>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
